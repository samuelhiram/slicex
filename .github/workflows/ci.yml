name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Same major as local development (Node 20 reached end of life in
        # April 2026).
        node-version: [24.x]
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm must be on PATH BEFORE setup-node: its `cache: 'pnpm'` asks pnpm
      # for the store path ("Unable to locate executable file: pnpm" otherwise).
      # package.json has no `packageManager` field, so the version is pinned
      # here (lockfile v9 = pnpm 9; the same one as local development).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture checks
        run: pnpm -w run check:arch

      - name: Env check
        run: pnpm -w run check:env

      - name: Typecheck
        run: pnpm -w run typecheck

      - name: Unit tests
        run: pnpm -w run test:unit -- --run

      - name: Build web (Vite + Worker)
        run: pnpm -w run build:web

      - name: Install Playwright browsers
        run: pnpm -w exec playwright install --with-deps

      - name: E2E tests
        run: pnpm -w run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
