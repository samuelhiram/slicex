name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run architecture checks
        run: pnpm -w run check:arch

      - name: Check env
        run: pnpm -w run check:env

      - name: Typecheck
        run: pnpm -w run typecheck

      - name: Unit tests
        run: pnpm -w run test:unit -- --run

      - name: Install Playwright browsers
        run: pnpm -w exec playwright install --with-deps

      - name: E2E tests (Playwright)
        run: pnpm -w run test:e2e -- --config=playwright.config.ts --reporter=github

      - name: Upload Playwright HTML report (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report || ''
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm i -g pnpm
      - name: Install deps
        run: pnpm install
      - name: Typecheck
        run: pnpm -w typecheck
      - name: Lint
        run: pnpm -w lint
      - name: Unit tests
        run: pnpm -w test:unit
      - name: Build
        run: pnpm build
