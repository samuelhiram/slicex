name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture checks
        run: pnpm -w run check:arch

      - name: Env check
        run: pnpm -w run check:env

      - name: Typecheck
        run: pnpm -w run typecheck

      - name: Unit tests
        run: pnpm -w run test:unit -- --run

      - name: Build web (Vite + Worker)
        run: pnpm -w run build:web

      - name: Install Playwright browsers
        run: pnpm -w exec playwright install --with-deps

      - name: E2E tests
        run: pnpm -w run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
